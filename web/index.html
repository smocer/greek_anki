<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F5EF">
  <meta name="description" content="Learn Greek by heart. Short flashcard lessons and Greek typing practice, with English and Russian explanations.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Greek Anki">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Greek Anki</title>
  <style>
    html, body { margin: 0; background: #F6F5EF; color: #233D35; font-family: system-ui, sans-serif; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; padding: 28px; }
    #loading img { width: 72px; height: 72px; border-radius: 22px; }
    #loading h1 { margin: 22px 0 8px; font-size: 24px; font-weight: 600; }
    #loading p { max-width: 300px; line-height: 1.5; color: #64726A; }
    #retry { border: 0; border-radius: 24px; padding: 14px 28px; font: inherit; background: #233D35; color: white; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <h1>Greek Anki</h1>
    <p id="loading-message">Opening your lessons…</p>
    <button id="retry" hidden>Try again</button>
    <noscript>JavaScript is needed to practice Greek. / Для занятий нужен JavaScript.</noscript>
  </div>
  <script src="app_loader.js" defer></script>
</body>
</html>
