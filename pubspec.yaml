name: greek_anki
description: Greek flashcards and typing practice, with bilingual explanations and focused beginner topics.
publish_to: 'none'
version: 1.9.0+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dictionary/greek.json
    - assets/dictionary/additions/
    - assets/audio/greek/
    - assets/audio/greek/words-nouns/
    - assets/audio/greek/words-names/
    - assets/audio/greek/words-verbs/
    - assets/audio/greek/words-pronouns/
    - assets/audio/greek/words-descriptions/
    - assets/audio/greek/words-connectors/
    - assets/audio/greek/words-numbers/
